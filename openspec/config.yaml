schema: spec-driven

context: |
  项目使用简体中文维护 OpenSpec 文档。所有新建或更新的 proposal、design、spec、tasks 及归档文档，其标题和自然语言内容都必须使用简体中文。
  代码标识符、文件路径、命令、协议字段，以及 OpenSpec 校验器要求的固定语法标记可以保留英文。

rules:
  proposal:
    - 所有自然语言内容使用简体中文。
    - 仅保留 OpenSpec 模板或校验器要求的固定标题，以及代码标识符、路径和命令原文。
  design:
    - 所有标题和自然语言内容使用简体中文。
    - 代码标识符、路径、公式和命令保持原文。
  specs:
    - 需求名称、需求描述和场景内容使用简体中文。
    - ADDED、MODIFIED、REMOVED、RENAMED、Requirement、Scenario、WHEN、THEN、SHALL、MUST 等校验器固定标记可以保留英文。
  tasks:
    - 所有任务分组和任务描述使用简体中文。
    - 代码标识符、文件路径和命令保持原文。
